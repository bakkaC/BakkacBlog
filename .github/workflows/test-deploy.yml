# .github/workflows/test.yml (或者你的测试文件名)

name: Test deployment

on:
  pull_request:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # --- 修改开始 ---
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node >= 22.22.0.
          node-version: 22.22
          cache: 'pnpm' # 将缓存目标改为 pnpm
      # --- 修改结束 ---

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # 使用 pnpm install

      - name: Type-check
        run: pnpm check

      - name: Test build website
        # `pnpm build` also syncs images to R2, which needs Cloudflare
        # credentials this job has none of. Build the site only.
        run: pnpm run build:site
